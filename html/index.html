<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pager-popup" class="hidden">
    <div class="pager-header">
      <span class="pager-icon">&#128223;</span>
      <span id="pager-from">PAGE FROM #0000</span>
    </div>
    <div class="pager-body">
      <p id="pager-message"></p>
    </div>
    <div class="pager-footer">
      <span id="pager-time"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
